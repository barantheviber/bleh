name: build-windows

# Tests on Linux and Windows, then builds TraderBot.exe with PyInstaller,
# runs its self-test, wraps it in an installer, installs that silently and
# runs the self-test again from the installed copy. The installer and a
# portable zip are uploaded as the run's artifact.
on:
  push:
    branches: ['claude/**', 'main']
    paths-ignore:
      - 'research/data/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  TB_VERSION: '1.0.0'

jobs:
  test-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Qt system libraries
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libfontconfig1 libdbus-1-3 libnss3 libxcomposite1 libxdamage1 libxrandr2 \
            libxtst6 libgbm1 libasound2t64
      - run: pip install -r requirements-dev.txt
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
          QTWEBENGINE_CHROMIUM_FLAGS: --no-sandbox
        run: python -m pytest -q

  windows:
    needs: test-linux
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Tests on Windows
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: Build TraderBot.exe
        run: pyinstaller packaging/traderbot.spec --noconfirm --clean
      - name: Self-test the built exe
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $report = Join-Path $PWD "selftest-built.json"
          $p = Start-Process -FilePath "dist\TraderBot\TraderBot.exe" -ArgumentList "--selftest", "`"$report`"" -Wait -PassThru
          Get-Content $report
          if ($p.ExitCode -ne 0) { throw "self-test failed with exit code $($p.ExitCode)" }
      - name: Build the installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "/DAppVersion=$env:TB_VERSION" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          Get-ChildItem dist
      - name: Install silently and self-test the installed app
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $setup = "dist\TraderBot-Setup-$env:TB_VERSION.exe"
          $p = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER", "/MERGETASKS=!desktopicon" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exit code $($p.ExitCode)" }
          $exe = Join-Path $env:LOCALAPPDATA "Programs\TraderBot\TraderBot.exe"
          if (-not (Test-Path $exe)) { throw "not installed at $exe" }
          $report = Join-Path $PWD "selftest-installed.json"
          $p = Start-Process -FilePath $exe -ArgumentList "--selftest", "`"$report`"" -Wait -PassThru
          Get-Content $report
          if ($p.ExitCode -ne 0) { throw "installed self-test failed with exit code $($p.ExitCode)" }
      - name: Portable zip
        shell: pwsh
        run: Compress-Archive -Path dist\TraderBot -DestinationPath "dist\TraderBot-portable-$env:TB_VERSION.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: TraderBot-Windows-${{ env.TB_VERSION }}
          path: |
            dist/TraderBot-Setup-*.exe
            dist/TraderBot-portable-*.zip
            selftest-*.json
            selftest_chart.png
          if-no-files-found: error
          retention-days: 30
