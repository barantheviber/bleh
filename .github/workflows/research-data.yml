name: research-data

# Downloads daily price history for the strategy study and commits it back to
# the branch. Runs only on claude/** branches, only when the ticker list or the
# fetcher changes.
on:
  push:
    branches: ['claude/**']
    paths:
      - 'research/tickers.txt'
      - 'research/fetch_data.py'
      - '.github/workflows/research-data.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: research-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy==2.1.3
      - name: Download daily history
        run: python -m research.fetch_data --tickers research/tickers.txt --out research/data
      - name: Commit data back to the branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/data
          if git diff --cached --quiet; then echo "No data changes"; exit 0; fi
          git commit -m "research: daily price data from Yahoo Finance [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
